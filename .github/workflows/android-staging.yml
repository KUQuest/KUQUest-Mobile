name: Android Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-staging
  cancel-in-progress: true

jobs:
  trust:
    name: Require a develop commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the commit is contained in develop
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            printf 'Staging source %s is not contained in origin/develop\n' "$GITHUB_SHA" >&2
            exit 78
          fi

  validate:
    name: Validate
    needs: trust
    uses: ./.github/workflows/ci.yml

  build:
    name: Build staging APK
    needs: [trust, validate]
    permissions:
      contents: read
    uses: ./.github/workflows/android-apk-build.yml
    # Required for environment-scoped secrets (actions/runner#4453).
    secrets: inherit
    with:
      source_sha: ${{ github.sha }}
      variant: staging
      version_code: ${{ github.run_number }}
      environment_name: staging
      retention_days: 7
