name: Android Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or ref contained in develop
        required: false
        default: develop
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-staging
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve trusted staging commit
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout develop history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate source commit
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SOURCE_SHA: ${{ github.sha }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            source_sha="$PUSH_SOURCE_SHA"
          else
            requested_ref=${REQUESTED_REF:-develop}
            source_sha=$(git rev-parse --verify --end-of-options "${requested_ref}^{commit}")
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Resolved staging source is not a full commit SHA: %s\n' "$source_sha" >&2
            exit 78
          fi
          if ! git merge-base --is-ancestor "$source_sha" origin/develop; then
            printf 'Staging source %s is not contained in origin/develop\n' "$source_sha" >&2
            exit 78
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for successful Mobile CI
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          max_attempts=30
          poll_interval_seconds=10
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            runs_json=$(gh api \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&head_sha=${SOURCE_SHA}&per_page=100")
            latest_run=$(jq -c --arg source_sha "$SOURCE_SHA" '
              [.workflow_runs[]
                | select(.name == "Mobile CI"
                    and .event == "push"
                    and .head_sha == $source_sha)]
              | sort_by([.created_at, .id])
              | last // empty
            ' <<<"$runs_json")
            if [[ -n "$latest_run" ]]; then
              status=$(jq -r '.status' <<<"$latest_run")
              if [[ "$status" == completed ]]; then
                conclusion=$(jq -r '.conclusion // "unknown"' <<<"$latest_run")
                if [[ "$conclusion" == success ]]; then
                  run_id=$(jq -r '.id' <<<"$latest_run")
                  printf 'Mobile CI run %s succeeded for %s.\n' "$run_id" "$SOURCE_SHA"
                  exit 0
                fi
                printf 'Mobile CI run for %s completed with conclusion %s; staging requires success.\n' "$SOURCE_SHA" "$conclusion" >&2
                exit 1
              fi
            fi
            if (( attempt < max_attempts )); then
              sleep "$poll_interval_seconds"
            fi
          done
          printf 'Timed out after %s seconds waiting for a successful Mobile CI push run for %s. Check the Mobile CI workflow and Actions permissions, then retry staging.\n' "$((max_attempts * poll_interval_seconds))" "$SOURCE_SHA" >&2
          exit 1

  build:
    name: Build staging APK
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/android-apk-build.yml
    # Required for environment-scoped secrets (actions/runner#4453).
    secrets: inherit
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      variant: staging
      version_code: ${{ github.run_number }}
      environment_name: staging
      retention_days: 7
