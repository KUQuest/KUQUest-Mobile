name: Mobile CI

on:
  pull_request:
    branches: [main, develop]
  # Reused by Android Staging and Android UAT so a push validates and builds in one run.
  workflow_call:

jobs:
  validate:
    name: Validate Mobile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Jest and TypeScript caches
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-cache
          key: mobile-ci-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: mobile-ci-${{ hashFiles('bun.lock') }}-

      - name: Format, lint, typecheck, and test
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          cache="$RUNNER_TEMP/ci-cache"
          mkdir -p "$cache"

          names=()
          pids=()
          start() {
            local name=$1
            shift
            "$@" >"$RUNNER_TEMP/$name.log" 2>&1 &
            names+=("$name")
            pids+=("$!")
          }

          start format bun run format:check
          start lint bun run lint
          start typecheck bun run typecheck --incremental --tsBuildInfoFile "$cache/tsc.tsbuildinfo"
          # A PR to develop tests only what its changes touch. Other runs test everything.
          scope=()
          if [ "$BASE_REF" = develop ]; then
            scope=(--changedSince "$BASE_SHA" --passWithNoTests)
          fi
          start test bun run test --cacheDirectory "$cache/jest" "${scope[@]}"

          status=0
          for index in "${!pids[@]}"; do
            name=${names[$index]}
            result=passed
            if ! wait "${pids[$index]}"; then
              result=FAILED
              status=1
            fi
            echo "::group::$name $result"
            cat "$RUNNER_TEMP/$name.log"
            echo '::endgroup::'
            if [ "$result" = FAILED ]; then
              echo "::error::$name failed"
            fi
          done
          exit "$status"
