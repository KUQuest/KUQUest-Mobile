name: Mobile CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  # Reused by Android Staging so a develop push validates and builds in one run.
  workflow_call:

jobs:
  validate:
    name: Validate Mobile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
