# Install: /etc/nginx/snippets/kuquest-release-proxy.conf
# Expects $release (a release tag) to be set by the including location.
resolver 127.0.0.53 valid=60s ipv6=off;
set $github api.github.com;
proxy_pass https://$github/repos/KUQuest/KUQUest-Mobile/releases/tags/$release;
proxy_ssl_server_name on;
proxy_set_header Host api.github.com;
proxy_set_header Accept application/vnd.github+json;
proxy_set_header User-Agent kuquest-download-page;
proxy_set_header Authorization "";
proxy_connect_timeout 5s;
proxy_read_timeout 10s;

proxy_cache kuquest_releases;
proxy_cache_key $release;
proxy_cache_valid 200 404 1m;
proxy_cache_lock on;
# Keep serving the last good answer if GitHub errors or rate-limits.
proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;

# nginx's own Cache-Control (server level) applies; drop GitHub's.
proxy_hide_header Cache-Control;
proxy_hide_header Set-Cookie;
