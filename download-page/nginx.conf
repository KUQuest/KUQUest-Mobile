# Static host for the KUQuest APK download page.
# Install: /etc/nginx/sites-available/kuquest-download (symlink into sites-enabled).

# Release JSON is fetched from GitHub once a minute and shared by every visitor,
# so the page never hits GitHub's 60 requests/hour/IP limit from the browser.
proxy_cache_path /var/cache/nginx/kuquest-releases levels=1:2 keys_zone=kuquest_releases:1m max_size=10m inactive=1d;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/kuquest-download;
    index index.html;

    # The page only talks to this server; APKs download straight from GitHub.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Names are fixed here, never taken from the request, so the page cannot be
    # used to reach other GitHub endpoints.
    location = /api/uat-latest {
        set $release uat-latest;
        include snippets/kuquest-release-proxy.conf;
    }

    location = /api/staging-latest {
        set $release staging-latest;
        include snippets/kuquest-release-proxy.conf;
    }
}
