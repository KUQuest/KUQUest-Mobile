# Static host for the KUQuest APK download page.
# Install: /etc/nginx/sites-available/kuquest-download (symlink into sites-enabled).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/kuquest-download;
    index index.html;

    # The page only calls the GitHub API; APKs download straight from GitHub.
    add_header Content-Security-Policy "default-src 'self'; connect-src https://api.github.com; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
